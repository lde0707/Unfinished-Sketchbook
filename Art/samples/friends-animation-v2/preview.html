<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>그림 친구 · NPC 애니메이션</title><style>body{margin:0;padding:32px;background:#17191d;color:#e8dfcf;font:16px system-ui}h1{font-size:24px}p{color:#bbb3a8}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}article{background:#25272b;padding:20px;border-radius:12px}canvas{width:100%;height:300px;object-fit:contain}button{padding:10px 14px;background:#51483c;color:#fff;border:0;border-radius:6px;margin:4px;cursor:pointer}.state{color:#d2bb88}small{display:block;margin-top:10px;color:#aaa}</style><h1>그림 친구와 NPC · 전신 프레임 애니메이션</h1><p>대기 → 상호작용 → 완성된 모습 → 사라짐 순서로 자동 재생됩니다. 실제 게임에서는 W 유지와 능력 조건을 적용합니다.</p><div><button onclick="mode='auto';origin=performance.now()">전체 연결</button><button onclick="mode='idle';origin=performance.now()">Idle 반복</button><button onclick="mode='interact';origin=performance.now()">상호작용 반복</button><button onclick="mode='depart';origin=performance.now()">사라짐 반복</button></div><main id="cards"></main><script>
let mode='auto',origin=performance.now();const people=[['dog','미완성 강아지',1.2],['sun','색칠 안 된 해님',1.2],['npc','책갈피 안내자',.65]],views=[];
for(const [id,name,duration]of people){const card=document.createElement('article');card.innerHTML=`<h2>${name}</h2><canvas width="512" height="420"></canvas><div class="state"></div><small>전신 원화 12장 · 대기 4 / 상호작용 4 / 사라짐 4</small>`;cards.append(card);const img=new Image();img.src=id+'-sheet.png';views.push({id,duration,img,canvas:card.querySelector('canvas'),label:card.querySelector('.state')})}
function draw(now){for(const v of views){const g=v.canvas.getContext('2d');g.clearRect(0,0,512,420);const age=(now-origin)/1000;let state=mode,t=age,alpha=1;if(mode==='auto'){const all=2.4+v.duration+.72+.6;t=age%all;if(t<2.4){state='idle'}else if(t<2.4+v.duration){state='interact';t-=2.4}else if(t<2.4+v.duration+.72){state='depart';t-=2.4+v.duration}else state='gone'}else t%=mode==='interact'?v.duration:mode==='depart'?1.1:1.62;
let frame=0;if(state==='idle'){const x=t%1.62;frame=x<.52?0:x<.94?1:x<1.1?2:3}else if(state==='interact')frame=4+Math.min(3,Math.floor(t/v.duration*4));else if(state==='depart'){frame=t<.14?8:t<.28?9:t<.46?10:11;alpha=1-Math.min(1,Math.max(0,(t-.3)/.42))}else alpha=0;
v.label.textContent=state==='idle'?'대기':state==='interact'?'상호작용 · 완성':state==='depart'?'획득 · 종이 조각으로 사라짐':'완료';if(v.img.complete&&v.img.naturalWidth){const w=v.img.naturalWidth/4,h=v.img.naturalHeight/3,s=Math.min(390/w,365/h);g.globalAlpha=alpha;g.drawImage(v.img,(frame%4)*w,Math.floor(frame/4)*h,w,h,(512-w*s)/2,390-h*s,w*s,h*s);g.globalAlpha=1}}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
