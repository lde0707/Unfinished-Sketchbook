<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>방별 배경 · Unfinished Sketchbook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111316;color:#e6dfd2;font:14px/1.6 system-ui,sans-serif}button,select,input{font:inherit;color:inherit;background:#20242a;border:1px solid #41464c;border-radius:5px;padding:7px 11px}button{cursor:pointer}button:hover,button.active{background:#383d43;border-color:#b4a17e}header{padding:20px 26px;border-bottom:1px solid #35393e;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:21px;letter-spacing:-.5px;margin:0}p{margin:5px 0;color:#a7a7a4}main{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 101px)}aside{overflow:auto;border-right:1px solid #35393e;padding:16px}aside label{display:block;margin-bottom:12px}select,input{width:100%;margin-top:4px}#rooms{display:flex;flex-direction:column;gap:4px}#rooms button{text-align:left;font-size:13px;border-color:transparent}#rooms small{display:block;color:#999;font-size:11px}article{min-width:0;overflow:auto;padding:22px}h2{margin:0;font-size:19px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{font-size:12px;color:#c9b48a;margin-bottom:2px}.actions{display:flex;gap:6px}#stage{margin-top:18px;background:#090a0c;border:1px solid #33383e;overflow:auto;min-height:320px;max-height:70vh}#shot{display:block;width:100%;height:auto}#stage.zoom #shot{width:1920px;max-width:none}#detail{max-width:950px;margin-top:16px;line-height:1.9}#meta{font-size:12px;color:#b9ab91}a{color:#d3bd92}footer{color:#7e8387;font-size:12px;margin-top:15px}@media(max-width:800px){main{grid-template-columns:190px minmax(0,1fr)}header{padding:14px}article{padding:12px}.head{display:block}.actions{margin-top:10px}}
</style>
<header><div><h1>방의 구조를 따라가는 배경</h1><p>반복되는 뒷벽 앞에, 방마다 다른 실루엣과 빈 공간을 배치했습니다.</p></div><span id="count"></span></header>
<main><aside><label>구역<select id="zone"><option value="all">전체 구역</option><option value="A">1지역 · 종이굴</option><option value="B">1지역 · 흑연 광산</option><option value="C">1지역 · 나무 속</option><option value="D">1지역 · 뿌리 심부</option><option value="E">2지역 · 노을 굴</option><option value="F">2지역 · 밀랍 공방</option><option value="G">2지역 · 지하 협곡</option><option value="H">2지역 · 기사의 탑</option></select></label><label>방 찾기<input id="search" placeholder="방 이름 또는 번호"></label><div id="rooms"></div></aside>
<article><div class="head"><div><div class="badge" id="eyebrow"></div><h2 id="title"></h2></div><div class="actions"><button id="prev" aria-label="이전 방">←</button><button id="next" aria-label="다음 방">→</button><button id="zoom">원본 크기</button><button id="play">게임 열기</button></div></div><div id="stage"><img id="shot" alt="Unity에서 렌더링한 방별 배경과 실제 지형"></div><div id="detail"><strong id="concept"></strong><p id="description"></p><div id="meta"></div></div><footer>실제 Unity 씬 렌더 · 배경은 지형·플레이어 뒤에 배치 · 원화 35종을 방마다 조합 · 충돌과 이동 경로는 그대로 유지</footer></article></main>
<script>
let plan,rooms=[],chosen;const $=id=>document.getElementById(id);
function renderList(){const z=$('zone').value,q=$('search').value.trim();rooms=plan.rooms.filter(r=>(z==='all'||r.z===z)&&(!q||(r.id+' '+r.name).includes(q)));$('rooms').replaceChildren();for(const r of rooms){const b=document.createElement('button');b.dataset.id=r.id;b.textContent=r.id+'  '+r.name;const small=document.createElement('small');small.textContent=r.w+' × '+r.h+'칸 · '+r.props.length+'개 배경 조각';b.append(small);b.onclick=()=>select(r);$('rooms').append(b);}if(rooms.length&&!rooms.some(r=>r.id===chosen?.id))select(rooms[0]);else mark();}
function mark(){for(const b of $('rooms').children)b.classList.toggle('active',b.dataset.id===chosen?.id);}
function select(r){chosen=r;$('eyebrow').textContent=r.r+'지역 / '+r.z+'구역 / '+r.id;$('title').textContent=r.name;$('concept').textContent=r.title;$('description').textContent=r.design;$('meta').textContent=`${r.w} × ${r.h}칸 · 128px 타일 기준 ${r.w*128} × ${r.h*128}px · 화면 약 ${r.screensX} × ${r.screensY}개 · 배경 ${r.props.length}조각 · 중간층 ${r.mezzanines}개`;$('shot').src='rooms/'+r.id+'.png';$('shot').alt=r.name+' — '+r.title;history.replaceState(null,'','#'+r.id);mark();}
$('zone').onchange=renderList;$('search').oninput=renderList;$('prev').onclick=()=>select(rooms[(rooms.indexOf(chosen)-1+rooms.length)%rooms.length]||chosen);$('next').onclick=()=>select(rooms[(rooms.indexOf(chosen)+1)%rooms.length]||chosen);
$('zoom').onclick=()=>{const on=$('stage').classList.toggle('zoom');$('zoom').textContent=on?'화면에 맞추기':'원본 크기';};
const spawns={'1-01':'245,129','1-09':'78,123','1-14':'108,48','2-03':'372,28','2-04':'430,30','2-07':'300,88','2-18':'527,115'};
$('play').onclick=()=>{const spawn=chosen.previewSpawn||spawns[chosen.id];window.open('http://127.0.0.1:8080/?v=room-backdrops-20261018'+(spawn?'&spawn='+spawn:''),'_blank');};
fetch('room-layouts.json').then(r=>r.json()).then(p=>{plan=p;$('count').textContent=`${p.rooms.length}개 방 · 35종 원화 · 3개 깊이 레이어`;chosen=p.rooms.find(r=>r.id===location.hash.slice(1))||p.rooms.find(r=>r.id==='1-09');renderList();select(chosen);}).catch(e=>{$('title').textContent='미리보기를 불러오지 못했습니다';$('description').textContent=e.message;});
</script></html>
