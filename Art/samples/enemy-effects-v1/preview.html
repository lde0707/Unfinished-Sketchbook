<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>적과 보스 · 먹과 종이 이펙트</title><style>body{background:#181e22;color:#e5dfd2;font:16px system-ui;line-height:1.6;margin:0}main{max-width:1400px;margin:auto;padding:30px}h1{font-size:28px}h2{font-size:22px;margin-top:36px}p{color:#aeb4b3}nav{display:flex;gap:10px;flex-wrap:wrap}a{padding:9px 15px;border:1px solid #596163;background:#303638;color:inherit;text-decoration:none;border-radius:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;display:block;border:1px solid #475050;border-radius:5px}figure{margin:0}figcaption{margin:8px 0 22px}@media(max-width:800px){main{padding:16px}.grid{grid-template-columns:1fr}}</style><main><h1>적과 보스 · 먹과 종이 이펙트</h1><p>아래는 이펙트가 적용된 실제 Unity 화면입니다. 공격 준비의 모이는 파편, 타격 순간의 먹 튐, 빠른 이동의 잔상, 착지 충격, 사망 시 흩어지는 종이 조각을 보강했습니다.</p><nav><a href="/?v=enemy-effects-20261024&spawn=255,34">1지역 보스 플레이</a><a href="/?v=enemy-effects-20261024&spawn=518,50">2지역 기사 플레이</a><a href="/?v=enemy-effects-20261024&spawn=13,120">광산 감독 플레이</a></nav><div id="content"></div><p>현재 맵의 일반 적 33종·95개 배치와 보스 패턴 12개·중간 보스 2종에 연결했습니다. 효과는 장식이며 기존 공격 판정·타이밍과 카메라 밝기 0.9를 유지합니다.</p></main><script>
const groups=[['흑연 보스 · 여섯 패턴',[['boss1-Sweep','가로 베기 · 흑연 날과 종이 파편'],['boss1-Slam','내려찍기 · 바닥 번짐과 옆으로 퍼지는 분진'],['boss1-Rush','돌진 · 전신 잔상과 긴 궤적'],['boss1-Roots','뿌리 솟기 · 각 활성 지점의 충격'],['boss1-Fan','파편 발사 · 발사구와 탄의 꼬리'],['boss1-Cross','교차 베기 · 두 번의 타격에 각각 반응']]],['크레파스 거북과 기사',[['turtle-0','거북의 구르기'],['turtle-1','거북의 밀랍 조각 발사'],['knight-0','기사의 연속 찌르기'],['knight-1','부러진 창 발사'],['knight-2','기사의 돌진'],['knight-3','기사의 내려찍기']]],['일반 적과 중간 보스',[['normal-COMMON01','공통 적의 공격'],['normal-R102','포탑 · 발사구의 먹 튐'],['normal-R203','날아드는 몬스터 · 비행 잔상'],['normal-G01','도약 몬스터 · 몸의 궤적과 착지'],['normal-H03','리본 망령 · 연속 발사'],['elite-23','광산 감독 · 어깨 돌진'],['elite-44','덩굴 사냥꾼 · 도약 베기']]],['사망',[['normal-death','일반 적 · 먹과 종이 조각으로 흩어짐'],['boss1-death','보스 · 큰 조각과 오래 남는 분진']]]];for(const [title,items]of groups){const h=document.createElement('h2');h.textContent=title;const grid=document.createElement('div');grid.className='grid';for(const [file,label]of items){const f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption');im.src='/enemy-effects/'+file+'.png';im.alt=label;im.loading='eager';c.textContent=label;f.append(im,c);grid.append(f);}document.querySelector('#content').append(h,grid);}window.enemyEffectsPreview={ready:true,captures:groups.reduce((n,g)=>n+g[1].length,0)};
</script>
