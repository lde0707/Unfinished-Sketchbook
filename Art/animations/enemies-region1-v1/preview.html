<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1지역 몬스터 · 3종 애니메이션</title><style>*{box-sizing:border-box}body{margin:0;background:#171b20;color:#eee7db;font:15px/1.6 system-ui}main{max-width:1400px;margin:auto;padding:30px}h1{font-size:30px}p{color:#b9b5ad}button,select,input{font:inherit}button,select{background:#30373e;color:#eee7db;border:1px solid #657078;border-radius:5px;padding:9px;cursor:pointer}button.active{border-color:#e4c494;color:#ffe3af}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.layout{display:grid;grid-template-columns:250px 1fr;gap:24px}nav{display:flex;flex-direction:column;gap:6px;max-height:860px;overflow:auto}nav button{text-align:left}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.states canvas{width:100%;background:repeating-conic-gradient(#272e34 0% 25%,#303840 0% 50%) 50%/24px 24px;border-radius:8px}.states h3{margin:4px 0}#map{width:100%;border:1px solid #58616a;border-radius:8px}.note{border-left:3px solid #d6b784;padding:10px 18px;background:#242a30}a{color:#d9bb8f}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#frames img{width:100%;background:#2a3037}small{color:#a6a99f}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{max-height:180px}.states{grid-template-columns:repeat(2,1fr)}main{padding:15px}}</style>
<main><h1>1지역 몬스터 · 이동 / 공격 / 죽음</h1><p id="summary">불러오는 중…</p><div class="note">이미지 생성으로 만든 자세 프레임을 순서대로 재생합니다. 피격 동작은 제외했고 Unity에서는 짧은 점멸만 표시합니다. 이동만 반복 동작이며 나머지는 미리보기에서 잠시 멈춘 뒤 다시 보여줍니다. 아래 맵은 실제 Unity 캡처 위에 프레임을 얹은 브라우저 미리보기입니다.</div><div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><button id="step">한 프레임씩</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><button id="flip">좌우 반전</button><a href="prompts.json">생성 프롬프트</a><a href="manifest.json">프레임·타이밍 데이터</a></div><div class="layout"><nav id="list"></nav><div><h2 id="name"></h2><p id="description"></p><div class="states" id="states"></div><h3>맵에서 보기</h3><div class="controls" id="stateButtons"></div><canvas id="map" width="1550" height="872"></canvas><p id="timing"></p><details><summary>선택 동작의 네 프레임</summary><div id="frames"></div></details></div></div></main>
<script>
const stateNames=['이동','공격','죽음'];let data,selected,img,chosen=0,clock=0,playing=true,flip=false,stepIndex=null,last=performance.now();const bg=new Image();bg.src='map-background.png';
const canvases=stateNames.map((name,i)=>{const box=document.createElement('div');box.innerHTML=`<h3>${name}</h3><canvas width="384" height="384"></canvas><small></small>`;document.querySelector('#states').append(box);const b=document.createElement('button');b.textContent=name;b.onclick=()=>{chosen=i;clock=0;stepIndex=null;refreshFrames();};document.querySelector('#stateButtons').append(b);return box.querySelector('canvas')});
function frameAt(row){if(stepIndex!==null)return stepIndex;let ds=selected.durations[row],total=ds.reduce((a,b)=>a+b,0),t=clock%(total+(row===0?0:.7));for(let i=0;i<4;i++){if(t<ds[i])return i;t-=ds[i];}return 3;}
function sprite(ctx,row,f,x,y,size){if(!img?.complete||!img.naturalWidth)return;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(img,f*384,row*384,384,384,-size/2,-size*(1-selected.pivotY),size,size);ctx.restore();}
function refreshFrames(){document.querySelectorAll('#stateButtons button').forEach((b,i)=>b.classList.toggle('active',i===chosen));document.querySelector('#frames').innerHTML=Array.from({length:4},(_,i)=>`<img src="frames/${selected.id}/${String(chosen*4+i).padStart(2,'0')}.png" alt="${stateNames[chosen]} ${i+1}번">`).join('');document.querySelector('#timing').textContent=`${stateNames[chosen]} 프레임 유지 시간: ${selected.durations[chosen].map(x=>Math.round(x*1000)+'ms').join(' → ')}`;}
function select(m){selected=m;img=new Image();img.src=m.file;clock=0;stepIndex=null;document.querySelector('#name').textContent=m.id+' · '+m.name;document.querySelector('#description').textContent=m.zone+' / '+m.attack;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===m.id));refreshFrames();}
function draw(now){if(selected){if(playing)clock+=(now-last)/1000*Number(document.querySelector('#speed').value);canvases.forEach((c,i)=>{let ctx=c.getContext('2d');ctx.clearRect(0,0,384,384);let f=frameAt(i);sprite(ctx,i,f,192,384*(1-selected.pivotY),384);c.nextElementSibling.textContent=`프레임 ${f+1}/4`});let c=document.querySelector('#map'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,c.width,c.height);let size=384/selected.pixelsPerUnit*96;let y=selected.flying?470:612;sprite(ctx,chosen,frameAt(chosen),470,y,size);}last=now;requestAnimationFrame(draw)}
document.querySelector('#play').onclick=()=>{playing=!playing;stepIndex=null;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#restart').onclick=()=>{clock=0;stepIndex=null};document.querySelector('#step').onclick=()=>{playing=false;stepIndex=(stepIndex===null?frameAt(chosen)+1:stepIndex+1)%4;document.querySelector('#play').textContent='재생'};document.querySelector('#flip').onclick=()=>flip=!flip;
fetch('manifest.json').then(r=>r.json()).then(d=>{data=d;document.querySelector('#summary').textContent=`${d.enemies.length}종 · ${d.enemies.length*3}개 동작 · ${d.enemies.length*12}개 프레임 / 원화 프레임 애니메이션 v1`;for(const m of d.enemies){let b=document.createElement('button');b.dataset.id=m.id;b.textContent=m.id+' '+m.name;b.onclick=()=>select(m);document.querySelector('#list').append(b)}select(d.enemies[0]);requestAnimationFrame(draw)}).catch(e=>document.querySelector('#summary').textContent='불러오기 실패: '+e.message);
</script></html>
