<!doctype html><html lang="ko"><meta charset="utf-8"><title>종이 플레이어 · 벽타기</title><style>body{background:#171c22;color:#eadfce;font:16px system-ui;margin:35px}section{display:flex;gap:24px;flex-wrap:wrap}.stage{position:relative;width:350px;height:410px;background:#222a32;overflow:hidden}.wall{position:absolute;right:7px;top:0;width:28px;height:100%;background:#655d50;border-left:3px solid #b6a58a}img{position:absolute;width:384px;left:-25px;top:26px}button{padding:12px;margin:8px}p{max-width:850px;line-height:1.7}</style><h1>벽에 붙기 · 오르내리기</h1><p>기존 캐릭터를 참고한 4장 원화 루프. 게임에서는 벽 방향으로 접근해 붙은 뒤 W/S 또는 ↑/↓로 이동, Space로 벽 점프, 벽 반대 방향으로 손을 놓습니다.</p><section><div><h2>매달리기</h2><div class="stage"><div class="wall"></div><img src="frames/00.png"></div></div><div><h2>벽 이동</h2><div class="stage"><div class="wall"></div><img id="climb" src="frames/00.png"></div></div></section><button onclick="direction*=-1">오르기 / 내려가기</button><script>let direction=-1;const start=performance.now();function draw(t){let phase=(t-start)/130,frame=Math.floor(phase)%4;document.querySelector('#climb').src='frames/0'+frame+'.png';document.querySelector('#climb').style.top=(26+direction*Math.sin((t-start)/900)*18)+'px';requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></html>
