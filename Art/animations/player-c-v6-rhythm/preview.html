<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>달리기 재생 속도 · 30% 증가</title>
<style>body{margin:0;padding:26px;background:#192026;color:#eee3d2;font:16px system-ui;max-width:1100px;margin:auto}h1{font-size:26px}p{color:#b8b9b4;line-height:1.6}.pair{display:flex;gap:18px}.card{flex:1;min-width:0}canvas{width:100%;background:#2b343b;border:1px solid #52606a;border-radius:10px}button,select{padding:10px;background:#34424c;color:#eee3d2;border:1px solid #65717a;border-radius:6px;margin:5px}small{color:#acb3b4}img{width:100%}@media(max-width:650px){.pair{display:block}}</style>
<h1>달리기 애니메이션 · 30% 빠르게</h1><p>같은 전신 원화 8장과 같은 이동 속도. 오른쪽은 각 프레임을 1.3배 빠르게 재생합니다.</p>
<div class="pair"><section class="card"><p>기존 속도 <small>약 113.64ms / 프레임</small></p><canvas id="reference" width="512" height="512"></canvas></section><section class="card"><p>변경 속도 <small>약 87.41ms / 프레임</small></p><canvas id="ours" width="512" height="512"></canvas></section></div>
<button id="play">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><label><input type="checkbox" id="flip">좌우 반전</label><label>보기 속도 <select id="speed"><option value="1">정상</option><option value=".5">0.5배속</option><option value=".25">0.25배속</option></select></label><p id="status"></p>
<p><small>달리기 시작·멈춤, 점프, 공격, 대시 시간은 유지합니다. 원본 PNG와 등록 좌표는 변경하지 않았습니다.</small></p><details><summary>원화 8장</summary><img src="run-contact-sheet.jpg" alt="달리기 여덟 프레임"></details>
<script>
const canvases=[document.querySelector('#reference'),document.querySelector('#ours')],rates=[88/125,88/125*1.3];let frames=[],time=0,last=0,playing=true,manual=0;
function draw(){const state=[];canvases.forEach((c,n)=>{const ctx=c.getContext('2d'),f=playing?Math.floor(time*rates[n]/80)%8:manual;ctx.clearRect(0,0,512,512);ctx.strokeStyle='#66716f';ctx.beginPath();ctx.moveTo(0,448);ctx.lineTo(512,448);ctx.stroke();ctx.save();if(document.querySelector('#flip').checked){ctx.translate(512,0);ctx.scale(-1,1)}ctx.drawImage(frames[f],0,0);ctx.restore();state.push(f)});document.querySelector('#status').textContent=`기존 ${state[0]+1}/8 · 변경 ${state[1]+1}/8`;window.previewState={oldFrame:state[0],newFrame:state[1],playing,oldRate:rates[0],newRate:rates[1]}}
function tick(now){const dt=last?Math.min(100,now-last):0;last=now;if(playing)time+=dt*Number(document.querySelector('#speed').value);draw();requestAnimationFrame(tick)}
document.querySelector('#play').onclick=e=>{if(playing)manual=Math.floor(time*rates[1]/80)%8;playing=!playing;e.target.textContent=playing?'일시정지':'재생'};for(const [id,step]of [['prev',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{playing=false;manual=(manual+step+8)%8;document.querySelector('#play').textContent='재생';draw()};Promise.all(Array.from({length:8},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='frames/'+String(i).padStart(2,'0')+'.png'}))).then(v=>{frames=v;window.previewReady=true;requestAnimationFrame(tick)}).catch(e=>document.querySelector('#status').textContent='로딩 오류: '+e);
</script></html>
